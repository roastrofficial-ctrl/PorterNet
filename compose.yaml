services:
  checks:
    build:
      context: .
      target: checks
    network_mode: none
  rust-host:
    build:
      context: .
      target: host
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./demo:/exchange
      - ./fixtures:/fixtures:ro
  shell-host:
    build:
      context: .
      target: host
    entrypoint: ["/bin/sh", "/usr/local/bin/shell-host"]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./demo:/exchange
      - ./fixtures:/fixtures:ro
  native-interop:
    build:
      context: .
      dockerfile: Interop.Dockerfile
      additional_contexts:
        porter_reference: ${PORTER_REFERENCE_CONTEXT:-https://github.com/roastrofficial-ctrl/What-if-Porter.git#7e8dc1790e9c0dad7153a2f87cd10a2780b452aa}
    network_mode: none
